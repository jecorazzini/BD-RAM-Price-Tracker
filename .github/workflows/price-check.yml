name: Price Check

# Runs 3x/day, 8 hours apart (10:00 UTC / 6am EDT, plus +8h and +16h).
# Note this is a step back up from the once-daily schedule this was
# deliberately dropped to earlier, specifically to reduce Amazon
# bot-detection risk — GitHub-hosted runners use shared datacenter IPs,
# which get flagged more readily than a residential IP, and this repo has
# already hit Amazon's soft bot-check at least once. If blocks become
# frequent, drop back to once a day, or move this to run locally instead
# (e.g. Windows Task Scheduler) — see README.
#
# GitHub Actions cron is always UTC and does NOT shift for daylight saving,
# so 10:00 UTC is 6am EDT now but will become 5am once EST kicks in (~Nov).
on:
  schedule:
    - cron: '0 10,18,2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run price check
        working-directory: scripts
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      # The script bakes the day's prices into index.html and price-history.json
      # on disk — commit those back so the live site reflects today's run.
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html price-history.json
          git diff --cached --quiet || git commit -m "Update RAM prices ($(date -u +%Y-%m-%d))"
          git push
